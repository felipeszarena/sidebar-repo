name: Sync design knowledge

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-knowledge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node knowledge/sync-index.mjs
      - name: Commit index
        run: |
          if git diff --quiet data/index.json; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "design-knowledge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Sync Sidebar.io index ($(date -u +%Y-%m-%d))"
          git push
